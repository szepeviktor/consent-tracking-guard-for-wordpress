checks:
  plugin-version:
    normalize: version
    expected:
      reader: wordpress-plugin
      file: consent-tracking-guard-for-wordpress.php
      path: $.Version
    values:
      translation-template:
        reader: gettext
        file: languages/consent-tracking-guard-for-wordpress.pot
        path: $.project.version
      config-init:
        reader: php
        file: consent-tracking-guard-for-wordpress.php
        path: $.constants['SzepeViktor\\ConsentTrackingGuard\\VERSION']
      release-tag:
        reader: env
        variable: RELEASE_TAG
        normalize: trim-v-prefix

  minimum-php:
    normalize: version
    expected:
      reader: composer
      file: composer.json
      path: $.require.php
      normalize: composer-minimum
    values:
      plugin-header:
        reader: wordpress-plugin
        file: consent-tracking-guard-for-wordpress.php
        path: $['Requires PHP']
      github-actions:
        reader: yaml
        file: .github/workflows/release.yml
        path: $.jobs.plugin_zip.steps[0].with['php-version']
